<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPatientMonitor — Live Dashboard</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 50px; }
        .card { background: #1e1e1e; border-radius: 10px; padding: 20px; margin: 10px; display: inline-block; width: 200px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .value { font-size: 2.5em; font-weight: bold; margin: 10px 0; }
        .unit { font-size: 0.5em; color: #aaa; }
        #status { margin-top: 30px; padding: 15px; border-radius: 5px; font-weight: bold; font-size: 1.2em; background: #2e7d32; }
        .critical { background: #d32f2f !important; animation: flash 1s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <h1>SmartPatientMonitor</h1>
    <p>Live ESP32 Telemetry</p>

    <div class="card">
        <div>Heart Rate</div>
        <div class="value" id="hr">--</div>
        <div class="unit">bpm</div>
    </div>
    <div class="card">
        <div>SpO₂</div>
        <div class="value" id="spo2">--</div>
        <div class="unit">%</div>
    </div>
    <div class="card">
        <div>Temperature</div>
        <div class="value" id="temp">--</div>
        <div class="unit">°C</div>
    </div>

    <div id="status">Connecting to MQTT...</div>

    <script>
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

        client.on('connect', () => {
            document.getElementById('status').innerText = 'Connected. Waiting for data...';
            document.getElementById('status').style.background = '#1976d2';
            client.subscribe('patient/sensor');
            client.subscribe('patient/alert');
        });

        client.on('message', (topic, message) => {
            const msg = message.toString();

            if (topic === 'patient/sensor') {
                try {
                    const data = JSON.parse(msg);
                    document.getElementById('hr').innerText = data.hr;
                    document.getElementById('spo2').innerText = data.spo2;
                    document.getElementById('temp').innerText = data.temp.toFixed(1);
                    
                    const statusEl = document.getElementById('status');
                    if (!statusEl.classList.contains('critical')) {
                        statusEl.innerText = 'Patient Status: NORMAL';
                        statusEl.style.background = '#2e7d32';
                    }
                } catch (e) {
                    console.error("Invalid JSON", msg);
                }
            }

            if (topic === 'patient/alert' && msg === 'CRITICAL') {
                const statusEl = document.getElementById('status');
                statusEl.innerText = '⚠️ CRITICAL ALERT ⚠️';
                statusEl.classList.add('critical');
            }
        });

        client.on('error', (err) => {
            document.getElementById('status').innerText = 'MQTT Connection Error';
        });
    </script>
</body>
</html>
